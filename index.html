    <script>
      window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) };
      (function () {
        var docEl = document.documentElement;
        docEl.classList.add('js');
        try {
          var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var reducedData = window.matchMedia && window.matchMedia('(prefers-reduced-data: reduce)').matches;
          var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
          var saveData = Boolean(conn && conn.saveData);
          var lowMem = typeof navigator.deviceMemory === 'number' && navigator.deviceMemory <= 4;
          var lowCpu = typeof navigator.hardwareConcurrency === 'number' && navigator.hardwareConcurrency <= 4;
          var isTouchMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || (window.matchMedia && window.matchMedia('(hover: none)').matches) || (window.innerWidth < 1024);
          var savedLite = localStorage.getItem('performanceMode') === 'true';
          if (reduced) {
            docEl.dataset.motionMode = 'reduced';
            docEl.classList.add('js-reveal-safe');
          } else if (reducedData || saveData || lowMem || lowCpu || savedLite || isTouchMobile) {
            docEl.dataset.motionMode = 'lite';
          } else {
            docEl.dataset.motionMode = 'full';
          }
        } catch (e) {
          docEl.dataset.motionMode = 'lite';
        }
        window.setTimeout(function () {
          docEl.classList.add('js-reveal-safe');
        }, 1500);

        var loadPlausible = function () {
          if (document.querySelector('script[data-domain="chestaa.com"]')) return;
          var s = document.createElement('script');
          s.defer = true;
          s.setAttribute('data-domain', 'chestaa.com');
          s.src = 'https://plausible.io/js/script.js';
          document.head.appendChild(s);
        };
        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(loadPlausible, { timeout: 3500 });
        } else {
          window.addEventListener('load', function () {
            window.setTimeout(loadPlausible, 1200);
          }, { once: true });
        }
      })();
    </script>
