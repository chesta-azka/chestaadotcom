<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bgConsult" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F8F6FE" />
      <stop offset="100%" stop-color="#EFEAFB" />
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bgConsult)" />
  <rect x="64" y="64" width="1072" height="772" rx="32" fill="#FFFFFF" stroke="rgba(91,60,196,0.16)" stroke-width="2" />

  <!-- Top Header -->
  <rect x="112" y="112" width="360" height="36" rx="18" fill="#EFEAFB" />
  <circle cx="134" cy="130" r="5" fill="#6A3FD0" />
  <text x="150" y="135" fill="#6A3FD0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" letter-spacing="1.5">AI AGENT · JASA PROFESIONAL B2B</text>
  <text x="1088" y="135" text-anchor="end" fill="#5B5675" font-family="'JetBrains Mono', monospace" font-size="13">MOCKUP INTERFACE</text>

  <!-- Left Copy -->
  <text x="112" y="210" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="700">Agen Kualifikasi Klien &amp;</text>
  <text x="112" y="254" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="700">Penjadwalan Konsultan</text>
  <text x="112" y="302" fill="#5B5675" font-family="'Plus Jakarta Sans', sans-serif" font-size="17">Menyaring kebutuhan calon klien korporat di WhatsApp,</text>
  <text x="112" y="328" fill="#5B5675" font-family="'Plus Jakarta Sans', sans-serif" font-size="17">mencatat ringkasan ke CRM, dan mengunci jadwal sesi</text>
  <text x="112" y="354" fill="#5B5675" font-family="'Plus Jakarta Sans', sans-serif" font-size="17">konsultasi tanpa bolak-balik chat dengan admin.</text>

  <!-- Pipeline Summary Cards -->
  <g transform="translate(112, 396)">
    <rect width="420" height="106" rx="18" fill="#F8F6FE" stroke="rgba(91,60,196,0.14)" stroke-width="1.5" />
    <text x="28" y="38" fill="#6A3FD0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">LANGKAH 1 · KUALIFIKASI TERSTRUKTUR</text>
    <text x="28" y="66" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600">Identifikasi skala perusahaan &amp; jenis layanan</text>
    <text x="28" y="88" fill="#5B5675" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Menanyakan 3 pertanyaan inti dengan bahasa natural</text>
  </g>

  <g transform="translate(112, 522)">
    <rect width="420" height="106" rx="18" fill="#EFEAFB" stroke="rgba(91,60,196,0.18)" stroke-width="1.5" />
    <text x="28" y="38" fill="#6A3FD0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">LANGKAH 2 · SINKRONISASI CRM &amp; KALENDER</text>
    <text x="28" y="66" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600">Kartu prospek otomatis masuk ke dashboard tim</text>
    <text x="28" y="88" fill="#5B5675" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Partner konsultan menerima ringkasan sebelum rapat</text>
  </g>

  <!-- Right Phone Mockup -->
  <g transform="translate(596, 176)">
    <rect width="484" height="580" rx="28" fill="#F8F6FE" stroke="rgba(91,60,196,0.2)" stroke-width="2" />
    <rect x="0" y="0" width="484" height="68" rx="28" fill="#FFFFFF" />
    <line x1="0" y1="68" x2="484" y2="68" stroke="rgba(91,60,196,0.14)" stroke-width="1.5" />
    <circle cx="42" cy="34" r="16" fill="#6A3FD0" />
    <text x="70" y="31" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Asisten Konsultan B2B</text>
    <text x="70" y="49" fill="#6A3FD0" font-family="'JetBrains Mono', monospace" font-size="11">ONLINE · RESPON INSTAN</text>

    <!-- Incoming Lead -->
    <rect x="28" y="96" width="360" height="70" rx="16" fill="#FFFFFF" stroke="rgba(91,60,196,0.14)" stroke-width="1.5" />
    <text x="48" y="124" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">"Selamat pagi, kami butuh pendampingan</text>
    <text x="48" y="146" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">audit kepatuhan untuk perusahaan di Tangsel."</text>

    <!-- Agent Reply -->
    <rect x="56" y="186" width="400" height="106" rx="16" fill="#6A3FD0" />
    <text x="76" y="216" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600">"Selamat pagi! Agar konsultan senior kami siap,</text>
    <text x="76" y="238" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">boleh diinfokan bidang industri perusahaan dan</text>
    <text x="76" y="260" fill="#EFEAFB" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">target bulan pelaksanaan auditnya?"</text>

    <!-- Lead Answer -->
    <rect x="28" y="312" width="350" height="68" rx="16" fill="#FFFFFF" stroke="rgba(91,60,196,0.14)" stroke-width="1.5" />
    <text x="48" y="340" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">"Industri distribusi alat kesehatan, target</text>
    <text x="48" y="362" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">mulai bulan depan (sekitar 80 karyawan)."</text>

    <!-- CRM Action -->
    <rect x="28" y="400" width="428" height="148" rx="18" fill="#FFFFFF" stroke="#6A3FD0" stroke-width="1.5" />
    <text x="48" y="432" fill="#6A3FD0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">✓ PROSPEK B2B TERKUALIFIKASI → CRM</text>
    <text x="48" y="460" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Distribusi Alkes · 80 Staf · Target Bulan Depan</text>
    <text x="48" y="488" fill="#5B5675" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Undangan Google Meet Kamis 10.00 WIB terkirim</text>
    <text x="48" y="516" fill="#6A3FD0" font-family="'JetBrains Mono', monospace" font-size="12">Notifikasi dikirim ke WhatsApp Partner Konsultan</text>
  </g>

  <text x="112" y="798" fill="#5B5675" font-family="'JetBrains Mono', monospace" font-size="12">CHESTAADOTCOM · CONTOH MOCKUP AGEN KUALIFIKASI B2B</text>
</svg>
