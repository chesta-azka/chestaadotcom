<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bgClinic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F8F6FE" />
      <stop offset="100%" stop-color="#EFEAFB" />
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bgClinic)" />
  <circle cx="980" cy="180" r="220" fill="#7C54E0" fill-opacity="0.08" />
  <circle cx="220" cy="740" r="180" fill="#6A3FD0" fill-opacity="0.06" />

  <!-- Outer Card -->
  <rect x="64" y="64" width="1072" height="772" rx="32" fill="#FFFFFF" fill-opacity="0.88" stroke="rgba(91,60,196,0.16)" stroke-width="2" />

  <!-- Top Header Badge -->
  <rect x="112" y="112" width="340" height="36" rx="18" fill="#EFEAFB" />
  <circle cx="134" cy="130" r="5" fill="#6A3FD0" />
  <text x="150" y="135" fill="#6A3FD0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" letter-spacing="1.5">AI AGENT · KLINIK &amp; KESEHATAN</text>
  <text x="1088" y="135" text-anchor="end" fill="#5B5675" font-family="'JetBrains Mono', monospace" font-size="13">MOCKUP INTERFACE</text>

  <!-- Left Info Column -->
  <text x="112" y="210" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="700">Asisten WhatsApp &amp; Jadwal</text>
  <text x="112" y="254" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="700">Klinik Estetika BSD</text>
  <text x="112" y="302" fill="#5B5675" font-family="'Plus Jakarta Sans', sans-serif" font-size="17">Agent mengecek slot dokter di kalender, mencatat reservasi</text>
  <text x="112" y="328" fill="#5B5675" font-family="'Plus Jakarta Sans', sans-serif" font-size="17">pasien, dan mengirim pengingat H-1 otomatis via WhatsApp.</text>

  <!-- Tool Status Pills -->
  <g transform="translate(112, 370)">
    <rect width="420" height="84" rx="18" fill="#F8F6FE" stroke="rgba(91,60,196,0.14)" stroke-width="1.5" />
    <circle cx="36" cy="42" r="14" fill="#EFEAFB" />
    <circle cx="36" cy="42" r="6" fill="#6A3FD0" />
    <text x="66" y="38" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600">Sinkronisasi Kalender Dokter Real-Time</text>
    <text x="66" y="60" fill="#5B5675" font-family="'JetBrains Mono', monospace" font-size="12">Tool Call: check_doctor_slots(branch="BSD")</text>
  </g>

  <g transform="translate(112, 474)">
    <rect width="420" height="84" rx="18" fill="#F8F6FE" stroke="rgba(91,60,196,0.14)" stroke-width="1.5" />
    <circle cx="36" cy="42" r="14" fill="#EFEAFB" />
    <circle cx="36" cy="42" r="6" fill="#7C54E0" />
    <text x="66" y="38" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600">Serah Terima ke Admin Resepsionis</text>
    <text x="66" y="60" fill="#5B5675" font-family="'JetBrains Mono', monospace" font-size="12">Guardrail aktif untuk konsultasi medis khusus</text>
  </g>

  <g transform="translate(112, 578)">
    <rect width="420" height="84" rx="18" fill="#EFEAFB" stroke="rgba(91,60,196,0.18)" stroke-width="1.5" />
    <text x="28" y="38" fill="#6A3FD0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">STACK PRODUKSI</text>
    <text x="28" y="60" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600">WhatsApp Cloud API · Python · PostgreSQL · React</text>
  </g>

  <!-- Right Chat Phone Mockup -->
  <g transform="translate(600, 176)">
    <rect width="476" height="580" rx="28" fill="#F8F6FE" stroke="rgba(91,60,196,0.2)" stroke-width="2" />
    <rect x="0" y="0" width="476" height="68" rx="28" fill="#FFFFFF" />
    <line x1="0" y1="68" x2="476" y2="68" stroke="rgba(91,60,196,0.14)" stroke-width="1.5" />
    <circle cx="42" cy="34" r="16" fill="#6A3FD0" />
    <text x="70" y="31" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Asisten Reservasi Klinik BSD</text>
    <text x="70" y="49" fill="#6A3FD0" font-family="'JetBrains Mono', monospace" font-size="11">ONLINE · WHATSAPP VERIFIED</text>

    <!-- User Message -->
    <rect x="28" y="96" width="340" height="72" rx="16" fill="#FFFFFF" stroke="rgba(91,60,196,0.14)" stroke-width="1.5" />
    <text x="46" y="124" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">"Halo kak, jadwal dr. Nadia untuk facial</text>
    <text x="46" y="146" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">hari Sabtu besok masih kosong jam berapa?"</text>

    <!-- Agent Action Log -->
    <rect x="28" y="186" width="420" height="44" rx="12" fill="#EFEAFB" />
    <text x="46" y="213" fill="#6A3FD0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">✓ Mengecek jadwal dr. Nadia (Sabtu) → 2 slot tersedia</text>

    <!-- Agent Reply -->
    <rect x="56" y="248" width="392" height="114" rx="16" fill="#6A3FD0" />
    <text x="76" y="278" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600">"Halo Kak! Untuk Sabtu besok bersama dr. Nadia</text>
    <text x="76" y="300" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">tersedia pukul 13.00 dan 16.00 WIB di cabang BSD.</text>
    <text x="76" y="328" fill="#EFEAFB" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Mau kami kunci slot jam 13.00 atau 16.00 Kak?"</text>

    <!-- User Confirmation -->
    <rect x="28" y="382" width="250" height="54" rx="16" fill="#FFFFFF" stroke="rgba(91,60,196,0.14)" stroke-width="1.5" />
    <text x="46" y="414" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">"Jam 16.00 ya kak atas nama Rina."</text>

    <!-- Final Confirmation Badge -->
    <rect x="28" y="456" width="420" height="86" rx="16" fill="#FFFFFF" stroke="#6A3FD0" stroke-width="1.5" />
    <text x="48" y="486" fill="#6A3FD0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">✓ RESERVASI TERCATAT #KLN-409</text>
    <text x="48" y="510" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600">Sabtu, 16.00 WIB · dr. Nadia · Pengingat H-1 Aktif</text>
  </g>

  <text x="112" y="796" fill="#5B5675" font-family="'JetBrains Mono', monospace" font-size="12">CHESTAADOTCOM · CONTOH MOCKUP ARSITEKTUR PROYEK</text>
</svg>
