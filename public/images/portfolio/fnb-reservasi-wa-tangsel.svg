<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bgFnb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8F6FE" />
      <stop offset="100%" stop-color="#EFEAFB" />
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bgFnb)" />
  <rect x="64" y="64" width="1072" height="772" rx="32" fill="#FFFFFF" stroke="rgba(91,60,196,0.16)" stroke-width="2" />

  <!-- Top Header -->
  <rect x="112" y="112" width="350" height="36" rx="18" fill="#EFEAFB" />
  <circle cx="134" cy="130" r="5" fill="#6A3FD0" />
  <text x="150" y="135" fill="#6A3FD0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" letter-spacing="1.5">OTOMASI WORKFLOW · F&amp;B &amp; RETAIL</text>
  <text x="1088" y="135" text-anchor="end" fill="#5B5675" font-family="'JetBrains Mono', monospace" font-size="13">MOCKUP INTERFACE</text>

  <text x="112" y="208" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="700">Otomasi Rekap POS Multi-Cabang &amp; Laporan</text>
  <text x="112" y="250" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="700">Harian WhatsApp F&amp;B Serpong</text>

  <!-- Workflow Node Graph Canvas -->
  <g transform="translate(112, 290)">
    <rect width="976" height="450" rx="24" fill="#F8F6FE" stroke="rgba(91,60,196,0.16)" stroke-width="1.5" />

    <!-- Connector Lines -->
    <line x1="270" y1="160" x2="370" y2="160" stroke="#7C54E0" stroke-width="3" stroke-dasharray="6 6" />
    <line x1="610" y1="160" x2="700" y2="160" stroke="#7C54E0" stroke-width="3" stroke-dasharray="6 6" />
    <line x1="490" y1="230" x2="490" y2="300" stroke="#6A3FD0" stroke-width="3" />

    <!-- Node 1: POS Webhook -->
    <rect x="44" y="96" width="226" height="128" rx="20" fill="#FFFFFF" stroke="rgba(91,60,196,0.2)" stroke-width="1.5" />
    <rect x="64" y="118" width="90" height="24" rx="12" fill="#EFEAFB" />
    <text x="109" y="134" text-anchor="middle" fill="#6A3FD0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">TRIGGER 22:00</text>
    <text x="64" y="168" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Data Kasir POS</text>
    <text x="64" y="192" fill="#5B5675" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">3 Cabang Gading Serpong</text>

    <!-- Node 2: n8n + Python Aggregator -->
    <rect x="370" y="86" width="240" height="148" rx="20" fill="#FFFFFF" stroke="#6A3FD0" stroke-width="2" />
    <rect x="392" y="108" width="124" height="24" rx="12" fill="#6A3FD0" />
    <text x="454" y="124" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">N8N + PYTHON</text>
    <text x="392" y="158" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Rekonsiliasi &amp; HPP</text>
    <text x="392" y="182" fill="#5B5675" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Hitung omzet bersih, diskon,</text>
    <text x="392" y="202" fill="#5B5675" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">dan selisih bahan baku</text>

    <!-- Node 3: WhatsApp Summary -->
    <rect x="700" y="96" width="232" height="128" rx="20" fill="#FFFFFF" stroke="rgba(91,60,196,0.2)" stroke-width="1.5" />
    <rect x="720" y="118" width="110" height="24" rx="12" fill="#EFEAFB" />
    <text x="775" y="134" text-anchor="middle" fill="#6A3FD0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">WHATSAPP API</text>
    <text x="720" y="168" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Ringkasan ke Owner</text>
    <text x="720" y="192" fill="#5B5675" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Terkirim otomatis tiap malam</text>

    <!-- Bottom Node: PostgreSQL Ledger -->
    <rect x="270" y="300" width="440" height="110" rx="20" fill="#EFEAFB" stroke="rgba(91,60,196,0.2)" stroke-width="1.5" />
    <text x="300" y="338" fill="#6A3FD0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">DATABASE ARSIP · POSTGRESQL</text>
    <text x="300" y="366" fill="#17122B" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Riwayat Transaksi &amp; Peringatan Stok Menipis</text>
    <text x="300" y="390" fill="#5B5675" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Log eksekusi lengkap + auto-retry saat koneksi POS cabang melambat</text>
  </g>

  <text x="112" y="798" fill="#5B5675" font-family="'JetBrains Mono', monospace" font-size="12">CHESTAADOTCOM · CONTOH MOCKUP OTOMASI WORKFLOW</text>
