<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background with white/soft purple theme -->
  <rect width="1200" height="630" fill="#FFFFFF" />
  <rect width="1200" height="630" fill="#F8F6FE" opacity="0.65" />
  <circle cx="600" cy="315" r="380" fill="#EFEAFB" opacity="0.5" />

  <!-- Top bar chip -->
  <g transform="translate(60, 48)">
    <rect width="130" height="32" rx="16" fill="#EFEAFB" stroke="rgba(91,60,196,0.18)" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#6A3FD0" />
    <text x="32" y="21" fill="#6A3FD0" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">ILUSTRASI</text>
  </g>

  <!-- Schematic Notice -->
  <g transform="translate(600, 70)">
    <text x="0" y="0" text-anchor="middle" fill="#5B5675" font-family="JetBrains Mono, monospace" font-size="12">Ilustrasi skematik layanan, bukan peta</text>
  </g>

  <!-- Connecting Edges -->
  <g stroke="rgba(91, 60, 196, 0.22)" stroke-width="2.5" fill="none">
    <path d="M 600 315 L 260 170" />
    <path d="M 600 315 L 940 170" />
    <path d="M 600 315 L 260 460" />
    <path d="M 600 315 L 940 460" />
  </g>

  <!-- Traveling Dots (parked) -->
  <circle cx="430" cy="242" r="5" fill="#7C54E0" />
  <circle cx="770" cy="242" r="5" fill="#7C54E0" />
  <circle cx="430" cy="387" r="5" fill="#7C54E0" />
  <circle cx="770" cy="387" r="5" fill="#7C54E0" />

  <!-- Hub Node: BSD -->
  <g transform="translate(600, 315)">
    <!-- Layered shadow -->
    <rect x="-80" y="-76" width="160" height="160" rx="40" fill="rgba(106, 63, 208, 0.05)" />
    <rect x="-80" y="-78" width="160" height="160" rx="40" fill="rgba(106, 63, 208, 0.08)" />
    <rect x="-80" y="-80" width="160" height="160" rx="40" fill="#EFEAFB" stroke="#6A3FD0" stroke-width="2.5" />
    
    <!-- MapPin Icon -->
    <path d="M 0 -24 C -14 -24, -22 -16, -22 -4 C -22 10, 0 28, 0 28 C 0 28, 22 10, 22 -4 C 22 -16, 14 -24, 0 -24 Z" fill="none" stroke="#6A3FD0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="0" cy="-6" r="6" fill="#6A3FD0" />

    <text x="0" y="112" text-anchor="middle" fill="#17122B" font-family="Plus Jakarta Sans, sans-serif" font-size="22" font-weight="700">BSD</text>
  </g>

  <!-- Node: Tangerang Selatan -->
  <g transform="translate(260, 170)">
    <rect x="-60" y="-56" width="120" height="120" rx="30" fill="rgba(106, 63, 208, 0.05)" />
    <rect x="-60" y="-58" width="120" height="120" rx="30" fill="rgba(106, 63, 208, 0.08)" />
    <rect x="-60" y="-60" width="120" height="120" rx="30" fill="#FFFFFF" stroke="rgba(91,60,196,0.18)" stroke-width="1.5" />
    <path d="M 0 -18 C -10 -18, -16 -12, -16 -4 C -16 6, 0 20, 0 20 C 0 20, 16 6, 16 -4 C 16 -12, 10 -18, 0 -18 Z" fill="none" stroke="#6A3FD0" stroke-width="2" />
    <circle cx="0" cy="-5" r="4.5" fill="#6A3FD0" />
    <text x="0" y="86" text-anchor="middle" fill="#17122B" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="600">Tangsel</text>
  </g>

  <!-- Node: Pamulang -->
  <g transform="translate(940, 170)">
    <rect x="-60" y="-56" width="120" height="120" rx="30" fill="rgba(106, 63, 208, 0.05)" />
    <rect x="-60" y="-58" width="120" height="120" rx="30" fill="rgba(106, 63, 208, 0.08)" />
    <rect x="-60" y="-60" width="120" height="120" rx="30" fill="#FFFFFF" stroke="rgba(91,60,196,0.18)" stroke-width="1.5" />
    <path d="M 0 -18 C -10 -18, -16 -12, -16 -4 C -16 6, 0 20, 0 20 C 0 20, 16 6, 16 -4 C 16 -12, 10 -18, 0 -18 Z" fill="none" stroke="#6A3FD0" stroke-width="2" />
    <circle cx="0" cy="-5" r="4.5" fill="#6A3FD0" />
    <text x="0" y="86" text-anchor="middle" fill="#17122B" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="600">Pamulang</text>
  </g>

  <!-- Node: Jurang Mangu -->
  <g transform="translate(260, 460)">
    <rect x="-60" y="-56" width="120" height="120" rx="30" fill="rgba(106, 63, 208, 0.05)" />
    <rect x="-60" y="-58" width="120" height="120" rx="30" fill="rgba(106, 63, 208, 0.08)" />
    <rect x="-60" y="-60" width="120" height="120" rx="30" fill="#FFFFFF" stroke="rgba(91,60,196,0.18)" stroke-width="1.5" />
    <path d="M 0 -18 C -10 -18, -16 -12, -16 -4 C -16 6, 0 20, 0 20 C 0 20, 16 6, 16 -4 C 16 -12, 10 -18, 0 -18 Z" fill="none" stroke="#6A3FD0" stroke-width="2" />
    <circle cx="0" cy="-5" r="4.5" fill="#6A3FD0" />
    <text x="0" y="86" text-anchor="middle" fill="#17122B" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="600">Jurang Mangu</text>
  </g>

  <!-- Node: Lebak Bulus -->
  <g transform="translate(940, 460)">
    <rect x="-60" y="-56" width="120" height="120" rx="30" fill="rgba(106, 63, 208, 0.05)" />
    <rect x="-60" y="-58" width="120" height="120" rx="30" fill="rgba(106, 63, 208, 0.08)" />
    <rect x="-60" y="-60" width="120" height="120" rx="30" fill="#FFFFFF" stroke="rgba(91,60,196,0.18)" stroke-width="1.5" />
    <path d="M 0 -18 C -10 -18, -16 -12, -16 -4 C -16 6, 0 20, 0 20 C 0 20, 16 6, 16 -4 C 16 -12, 10 -18, 0 -18 Z" fill="none" stroke="#6A3FD0" stroke-width="2" />
    <circle cx="0" cy="-5" r="4.5" fill="#6A3FD0" />
    <text x="0" y="86" text-anchor="middle" fill="#17122B" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="600">Lebak Bulus</text>
  </g>
</svg>
