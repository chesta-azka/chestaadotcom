<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background with white/soft purple theme -->
  <rect width="1200" height="630" fill="#FFFFFF" />
  <rect width="1200" height="630" fill="#F8F6FE" opacity="0.65" />
  <circle cx="600" cy="315" r="380" fill="#EFEAFB" opacity="0.5" />

  <!-- Top bar chip -->
  <g transform="translate(60, 48)">
    <rect width="130" height="32" rx="16" fill="#EFEAFB" stroke="rgba(91,60,196,0.18)" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#6A3FD0" />
    <text x="32" y="21" fill="#6A3FD0" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">ILUSTRASI</text>
  </g>

  <!-- Metric Chart Container Card -->
  <g transform="translate(180, 120)">
    <!-- Card Background -->
    <rect x="0" y="0" width="840" height="420" rx="32" fill="#FFFFFF" stroke="rgba(91,60,196,0.18)" stroke-width="1.5" />
    <rect x="0" y="4" width="840" height="420" rx="32" fill="rgba(106, 63, 208, 0.05)" />

    <!-- Grid lines -->
    <line x1="80" y1="120" x2="760" y2="120" stroke="rgba(91,60,196,0.08)" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="80" y1="200" x2="760" y2="200" stroke="rgba(91,60,196,0.08)" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="80" y1="280" x2="760" y2="280" stroke="rgba(91,60,196,0.08)" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Bar Group 1: Agency Tradisional -->
    <g transform="translate(160, 340)">
      <!-- Muted tall bar -->
      <rect x="-45" y="-180" width="90" height="180" rx="16" fill="#EFEAFB" stroke="rgba(91,60,196,0.2)" stroke-width="1" />
      <text x="0" y="-195" text-anchor="middle" fill="#5B5675" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600">Rp25-50 Jt</text>
      <text x="0" y="30" text-anchor="middle" fill="#5B5675" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="600">Vendor Umum</text>
      <text x="0" y="50" text-anchor="middle" fill="#5B5675" font-family="JetBrains Mono, monospace" font-size="11">Biaya Overhead</text>
    </g>

    <!-- Bar Group 2: Template DIY / Pasaran -->
    <g transform="translate(420, 340)">
      <!-- Very low bar with hidden debt -->
      <rect x="-45" y="-70" width="90" height="70" rx="16" fill="#F8F6FE" stroke="rgba(91,60,196,0.18)" stroke-width="1" />
      <text x="0" y="-85" text-anchor="middle" fill="#5B5675" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600">Rp300-800 Rb</text>
      <text x="0" y="30" text-anchor="middle" fill="#5B5675" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="600">Template Instan</text>
      <text x="0" y="50" text-anchor="middle" fill="#5B5675" font-family="JetBrains Mono, monospace" font-size="11">Lambat &amp; Boncos</text>
    </g>

    <!-- Bar Group 3: CHESTAADOTCOM Custom Architecture -->
    <g transform="translate(680, 340)">
      <!-- Highlighted optimal bar -->
      <rect x="-45" y="-230" width="90" height="230" rx="16" fill="#EFEAFB" stroke="#6A3FD0" stroke-width="2" />
      <rect x="-35" y="-220" width="70" height="60" rx="8" fill="#6A3FD0" />
      <text x="0" y="-185" text-anchor="middle" fill="#FFFFFF" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">OPTIMAL</text>
      <text x="0" y="-245" text-anchor="middle" fill="#6A3FD0" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">Transparan</text>
      <text x="0" y="30" text-anchor="middle" fill="#17122B" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700">Arsitektur Kustom</text>
      <text x="0" y="50" text-anchor="middle" fill="#6A3FD0" font-family="JetBrains Mono, monospace" font-size="11">Cepat &amp; Mandiri</text>
    </g>
  </g>
</svg>
