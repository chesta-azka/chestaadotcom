<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" fill="none" role="img" aria-label="Diagram siklus kerja Agentic AI meliputi tahap perencanaan, pemanggilan tool, dan evaluasi hasil untuk operasional bisnis">
