<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background with white/soft purple theme -->
  <rect width="1200" height="630" fill="#FFFFFF" />
  <rect width="1200" height="630" fill="#F8F6FE" opacity="0.65" />
  <circle cx="600" cy="315" r="380" fill="#EFEAFB" opacity="0.5" />

  <!-- Top bar chip -->
  <g transform="translate(60, 48)">
    <rect width="130" height="32" rx="16" fill="#EFEAFB" stroke="rgba(91,60,196,0.18)" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#6A3FD0" />
    <text x="32" y="21" fill="#6A3FD0" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">ILUSTRASI</text>
  </g>

  <!-- Connecting Edges -->
  <g stroke="rgba(91, 60, 196, 0.22)" stroke-width="2.5" fill="none">
    <!-- Form & WhatsApp into Hub -->
    <path d="M 230 180 C 360 180, 420 315, 520 315" />
    <path d="M 230 450 C 360 450, 420 315, 520 315" />
    <!-- Hub to Output Nodes -->
    <path d="M 680 315 C 780 315, 820 150, 960 150" />
    <path d="M 680 315 C 780 315, 820 260, 960 260" />
    <path d="M 680 315 C 780 315, 820 370, 960 370" />
    <!-- Failure Edge to Notifikasi (never red, purple single accent) -->
    <path d="M 680 315 C 780 315, 820 480, 960 480" stroke-dasharray="6 6" stroke="#6A3FD0" />
  </g>

  <!-- Failure Label (Never Red) -->
  <g transform="translate(820, 440)">
    <rect x="-80" y="-12" width="160" height="24" rx="12" fill="#EFEAFB" stroke="#6A3FD0" stroke-width="1" />
    <text x="0" y="4" text-anchor="middle" fill="#6A3FD0" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">Gagal: tim diberi tahu</text>
  </g>

  <!-- Traveling Dots (parked) -->
  <circle cx="370" cy="225" r="5" fill="#7C54E0" />
  <circle cx="370" cy="405" r="5" fill="#7C54E0" />
  <circle cx="810" cy="205" r="5" fill="#7C54E0" />
  <circle cx="830" cy="355" r="5" fill="#7C54E0" />

  <!-- Node 1: Formulir -->
  <g transform="translate(170, 180)">
    <rect x="-60" y="-56" width="120" height="120" rx="30" fill="rgba(106, 63, 208, 0.05)" />
    <rect x="-60" y="-58" width="120" height="120" rx="30" fill="rgba(106, 63, 208, 0.08)" />
    <rect x="-60" y="-60" width="120" height="120" rx="30" fill="#FFFFFF" stroke="rgba(91,60,196,0.18)" stroke-width="1.5" />
    <rect x="-14" y="-18" width="28" height="36" rx="4" fill="none" stroke="#6A3FD0" stroke-width="2.5" />
    <line x1="-8" y1="-8" x2="8" y2="-8" stroke="#6A3FD0" stroke-width="2" />
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#6A3FD0" stroke-width="2" />
    <text x="0" y="86" text-anchor="middle" fill="#17122B" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="600">Formulir</text>
  </g>

  <!-- Node 2: WhatsApp -->
  <g transform="translate(170, 450)">
    <rect x="-60" y="-56" width="120" height="120" rx="30" fill="rgba(106, 63, 208, 0.05)" />
    <rect x="-60" y="-58" width="120" height="120" rx="30" fill="rgba(106, 63, 208, 0.08)" />
    <rect x="-60" y="-60" width="120" height="120" rx="30" fill="#FFFFFF" stroke="rgba(91,60,196,0.18)" stroke-width="1.5" />
    <path d="M -16 -8 C -16 -18, -4 -22, 0 -22 C 12 -22, 22 -14, 22 -2 C 22 10, 12 18, 0 18 C -4 18, -8 16, -11 15 L -20 18 L -18 9 C -21 4, -22 0, -22 -2" fill="none" stroke="#6A3FD0" stroke-width="2.5" stroke-linecap="round" />
    <text x="0" y="86" text-anchor="middle" fill="#17122B" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="600">WhatsApp</text>
  </g>

  <!-- Hub Node: Alur Otomatis -->
  <g transform="translate(600, 315)">
    <rect x="-84" y="-84" width="168" height="168" rx="42" fill="none" stroke="#6A3FD0" stroke-width="2" opacity="0.3" />
    <rect x="-70" y="-66" width="140" height="140" rx="36" fill="rgba(106, 63, 208, 0.05)" />
    <rect x="-70" y="-68" width="140" height="140" rx="36" fill="rgba(106, 63, 208, 0.08)" />
    <rect x="-70" y="-70" width="140" height="140" rx="36" fill="#EFEAFB" stroke="#6A3FD0" stroke-width="2.5" />
    <!-- Workflow Icon -->
    <rect x="-24" y="-24" width="18" height="18" rx="4" fill="none" stroke="#6A3FD0" stroke-width="2" />
    <rect x="6" y="-6" width="18" height="18" rx="4" fill="none" stroke="#6A3FD0" stroke-width="2" />
    <rect x="-24" y="6" width="18" height="18" rx="4" fill="none" stroke="#6A3FD0" stroke-width="2" />
    <path d="M -6 -15 L 6 -15 C 6 -15, 6 -6, 6 -6" fill="none" stroke="#6A3FD0" stroke-width="2" />
    <text x="0" y="104" text-anchor="middle" fill="#17122B" font-family="Plus Jakarta Sans, sans-serif" font-size="19" font-weight="700">Alur otomatis</text>
  </g>

  <!-- Output Nodes -->
  <!-- Google Sheets -->
  <g transform="translate(1010, 150)">
    <rect x="-50" y="-46" width="100" height="100" rx="26" fill="rgba(106, 63, 208, 0.05)" />
    <rect x="-50" y="-48" width="100" height="100" rx="26" fill="rgba(106, 63, 208, 0.08)" />
    <rect x="-50" y="-50" width="100" height="100" rx="26" fill="#FFFFFF" stroke="rgba(91,60,196,0.18)" stroke-width="1.5" />
    <rect x="-16" y="-18" width="32" height="36" rx="4" fill="none" stroke="#6A3FD0" stroke-width="2" />
    <line x1="-16" y1="-4" x2="16" y2="-4" stroke="#6A3FD0" stroke-width="1.5" />
    <line x1="-4" y1="-18" x2="-4" y2="18" stroke="#6A3FD0" stroke-width="1.5" />
    <text x="0" y="76" text-anchor="middle" fill="#17122B" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="600">Google Sheets</text>
  </g>

  <!-- Kalender -->
  <g transform="translate(1010, 260)">
    <rect x="-50" y="-46" width="100" height="100" rx="26" fill="rgba(106, 63, 208, 0.05)" />
    <rect x="-50" y="-48" width="100" height="100" rx="26" fill="rgba(106, 63, 208, 0.08)" />
    <rect x="-50" y="-50" width="100" height="100" rx="26" fill="#FFFFFF" stroke="rgba(91,60,196,0.18)" stroke-width="1.5" />
    <rect x="-16" y="-14" width="32" height="28" rx="4" fill="none" stroke="#6A3FD0" stroke-width="2" />
    <line x1="-16" y1="-4" x2="16" y2="-4" stroke="#6A3FD0" stroke-width="1.5" />
    <text x="0" y="76" text-anchor="middle" fill="#17122B" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="600">Kalender</text>
  </g>

  <!-- Invoice -->
  <g transform="translate(1010, 370)">
    <rect x="-50" y="-46" width="100" height="100" rx="26" fill="rgba(106, 63, 208, 0.05)" />
    <rect x="-50" y="-48" width="100" height="100" rx="26" fill="rgba(106, 63, 208, 0.08)" />
    <rect x="-50" y="-50" width="100" height="100" rx="26" fill="#FFFFFF" stroke="rgba(91,60,196,0.18)" stroke-width="1.5" />
    <rect x="-14" y="-18" width="28" height="36" rx="4" fill="none" stroke="#6A3FD0" stroke-width="2" />
    <line x1="-8" y1="-8" x2="8" y2="-8" stroke="#6A3FD0" stroke-width="1.5" />
    <line x1="-8" y1="2" x2="4" y2="2" stroke="#6A3FD0" stroke-width="1.5" />
    <text x="0" y="76" text-anchor="middle" fill="#17122B" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="600">Invoice</text>
  </g>

  <!-- Notifikasi -->
  <g transform="translate(1010, 480)">
    <rect x="-50" y="-46" width="100" height="100" rx="26" fill="rgba(106, 63, 208, 0.05)" />
    <rect x="-50" y="-48" width="100" height="100" rx="26" fill="rgba(106, 63, 208, 0.08)" />
    <rect x="-50" y="-50" width="100" height="100" rx="26" fill="#EFEAFB" stroke="#6A3FD0" stroke-width="1.5" />
    <path d="M 0 -16 C -10 -16, -14 -6, -14 6 L -16 12 L 16 12 L 14 6 C 14 -6, 10 -16, 0 -16 Z" fill="none" stroke="#6A3FD0" stroke-width="2" />
    <circle cx="0" cy="18" r="3" fill="#6A3FD0" />
    <text x="0" y="76" text-anchor="middle" fill="#6A3FD0" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700">Notifikasi</text>
  </g>
</svg>
