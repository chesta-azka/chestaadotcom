<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background with dark simulation theme -->
  <rect width="1200" height="630" fill="#1A0E42" />
  <circle cx="600" cy="315" r="380" fill="#2B1763" opacity="0.45" />

  <!-- Top bar chip -->
  <g transform="translate(60, 48)">
    <rect width="130" height="32" rx="16" fill="#2B1763" stroke="rgba(255,255,255,0.16)" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#B9A2F2" />
    <text x="32" y="21" fill="#B9A2F2" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">ILUSTRASI</text>
  </g>

  <!-- Connecting Edges -->
  <g stroke="rgba(255, 255, 255, 0.18)" stroke-width="2.5" fill="none">
    <!-- WhatsApp to Agent Hub -->
    <path d="M 240 315 L 530 315" />
    <!-- Hub to Output Nodes -->
    <path d="M 670 315 C 780 315, 820 160, 960 160" />
    <path d="M 670 315 C 780 315, 820 260, 960 260" />
    <path d="M 670 315 C 780 315, 820 370, 960 370" />
    <path d="M 670 315 C 780 315, 820 470, 960 470" />
    <!-- Branch to Human Staff -->
    <path d="M 600 385 L 600 500" stroke-dasharray="6 6" />
  </g>

  <!-- Branch Label -->
  <g transform="translate(600, 445)">
    <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#2B1763" stroke="#B9A2F2" stroke-width="1" />
    <text x="0" y="4" text-anchor="middle" fill="#FFFFFF" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">Serah ke staf</text>
  </g>

  <!-- Parked / Traveling Dots -->
  <circle cx="385" cy="315" r="5" fill="#B9A2F2" />
  <circle cx="780" cy="220" r="5" fill="#B9A2F2" />
  <circle cx="830" cy="360" r="5" fill="#B9A2F2" />

  <!-- Node 1: WhatsApp Input -->
  <g transform="translate(180, 315)">
    <rect x="-60" y="-60" width="120" height="120" rx="30" fill="#2B1763" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
    <path d="M -16 -8 C -16 -18, -4 -22, 0 -22 C 12 -22, 22 -14, 22 -2 C 22 10, 12 18, 0 18 C -4 18, -8 16, -11 15 L -20 18 L -18 9 C -21 4, -22 0, -22 -2" fill="none" stroke="#B9A2F2" stroke-width="2.5" stroke-linecap="round" />
    <text x="0" y="86" text-anchor="middle" fill="#B9A2F2" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="600">WhatsApp</text>
  </g>

  <!-- Hub Node: AI Agent -->
  <g transform="translate(600, 315)">
    <!-- Hub Pulse Ring -->
    <rect x="-84" y="-84" width="168" height="168" rx="42" fill="none" stroke="#B9A2F2" stroke-width="2" opacity="0.3" />
    <!-- Hub Card Body -->
    <rect x="-70" y="-70" width="140" height="140" rx="36" fill="#2B1763" stroke="#B9A2F2" stroke-width="2" />
    <rect x="-22" y="-18" width="44" height="36" rx="8" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="-9" cy="0" r="3.5" fill="#B9A2F2" />
    <circle cx="9" cy="0" r="3.5" fill="#B9A2F2" />
    <line x1="0" y1="-28" x2="0" y2="-18" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="0" cy="-30" r="3.5" fill="#B9A2F2" />
    <text x="0" y="100" text-anchor="middle" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="19" font-weight="700">AI Agent</text>
  </g>

  <!-- Output Nodes -->
  <!-- Node: Kalender -->
  <g transform="translate(1010, 160)">
    <rect x="-50" y="-50" width="100" height="100" rx="26" fill="#2B1763" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
    <rect x="-18" y="-14" width="36" height="30" rx="5" fill="none" stroke="#B9A2F2" stroke-width="2" />
    <line x1="-18" y1="-4" x2="18" y2="-4" stroke="#B9A2F2" stroke-width="2" />
    <text x="0" y="74" text-anchor="middle" fill="#B9A2F2" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="600">Kalender</text>
  </g>

  <!-- Node: Database -->
  <g transform="translate(1010, 260)">
    <rect x="-50" y="-50" width="100" height="100" rx="26" fill="#2B1763" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
    <ellipse cx="0" cy="-14" rx="18" ry="6" fill="none" stroke="#B9A2F2" stroke-width="2" />
    <path d="M -18 -14 L -18 10 C -18 14, 18 14, 18 10 L 18 -14" fill="none" stroke="#B9A2F2" stroke-width="2" />
    <text x="0" y="74" text-anchor="middle" fill="#B9A2F2" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="600">Database</text>
  </g>

  <!-- Node: CRM -->
  <g transform="translate(1010, 370)">
    <rect x="-50" y="-50" width="100" height="100" rx="26" fill="#2B1763" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
    <circle cx="-8" cy="-6" r="8" fill="none" stroke="#B9A2F2" stroke-width="2" />
    <path d="M -18 14 C -18 8, 2 8, 2 14" fill="none" stroke="#B9A2F2" stroke-width="2" />
    <circle cx="10" cy="-8" r="6" fill="none" stroke="#B9A2F2" stroke-width="1.5" />
    <text x="0" y="74" text-anchor="middle" fill="#B9A2F2" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="600">CRM</text>
  </g>

  <!-- Node: Invoice -->
  <g transform="translate(1010, 470)">
    <rect x="-50" y="-50" width="100" height="100" rx="26" fill="#2B1763" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
    <rect x="-14" y="-18" width="28" height="36" rx="4" fill="none" stroke="#B9A2F2" stroke-width="2" />
    <line x1="-8" y1="-8" x2="8" y2="-8" stroke="#B9A2F2" stroke-width="1.5" />
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#B9A2F2" stroke-width="1.5" />
    <text x="0" y="74" text-anchor="middle" fill="#B9A2F2" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="600">Invoice</text>
  </g>

  <!-- Branch Node: Staf Manusia -->
  <g transform="translate(600, 540)">
    <rect x="-50" y="-35" width="100" height="70" rx="20" fill="#2B1763" stroke="#B9A2F2" stroke-width="1.5" />
    <circle cx="0" cy="-6" r="9" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <path d="M -14 18 C -14 8, 14 8, 14 18" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <text x="0" y="55" text-anchor="middle" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="600">Staf</text>
  </g>
</svg>
