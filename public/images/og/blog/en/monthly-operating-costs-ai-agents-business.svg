<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="Monthly AI agent operating usage meter detailing language model token quotas, WhatsApp session fees, and cloud hosting">
