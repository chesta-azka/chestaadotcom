            <text x="60" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#17122B">RETENTION</text>
          </g><g transform="translate(264, 0)">
            <rect width="120" height="28" rx="6" fill="#F8F6FE" stroke="#C5B8EC" stroke-width="1" />
            <text x="60" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#17122B">UU PDP</text>
          </g>
    </g>

    <!-- Brand Footer -->
    <g transform="translate(0, 425)">
      <rect width="38" height="38" rx="10" fill="#6A3FD0" />
      <text x="19" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700" fill="#FFFFFF">C</text>
      <text x="52" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="0.08em" fill="#17122B">CHESTAADOTCOM</text>
      <text x="52" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#5B5675">chestaa.com · BSD &amp; South Tangerang</text>
    </g>
  </g>

  <!-- Right Miniature Hero Scene -->
  <g transform="translate(650, 95) scale(0.45)">
    <g>
        <rect x="280" y="180" width="1040" height="540" rx="24" fill="#F8F6FE" stroke="#C5B8EC" />
        <!-- Stage 1: Consent Card -->
        <rect x="320" y="240" width="290" height="420" rx="18" fill="#FFFFFF" stroke="#C5B8EC" />
        <rect x="355" y="285" width="220" height="90" rx="12" fill="#17122B" />
        <circle cx="465" cy="485" r="54" fill="#6A3FD0" />
        <path d="M 445 485 L 460 500 L 490 468" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
        <!-- Stage 2: Redaction / Minimization Filter -->
        <rect x="655" y="240" width="290" height="420" rx="18" fill="#2B1763" />
        <rect x="690" y="300" width="220" height="42" rx="8" fill="#FFFFFF" />
        <rect x="690" y="370" width="220" height="42" rx="8" fill="#7C54E0" />
        <rect x="690" y="440" width="220" height="160" rx="12" fill="#17122B" />
        <!-- Stage 3: Retention Vault -->
        <rect x="990" y="240" width="290" height="420" rx="18" fill="#17122B" />
        <circle cx="1135" cy="410" r="82" fill="#9E7BF0" />
        <circle cx="1135" cy="410" r="34" fill="#17122B" />
        <rect x="1030" y="535" width="210" height="75" rx="12" fill="#FFFFFF" />
      </g>
