<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="Diagram showing message match from Meta and Google Ads to a fast-loading landing page with a streamlined lead capture">
  <defs>
    <pattern id="ogGrid64" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#17122B" stroke-width="1" stroke-opacity="0.04" />
    </pattern>
    <radialGradient id="ogGlow" cx="920" cy="315" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B9A2F2" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#F8F6FE" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#F8F6FE" />
  <rect width="1200" height="630" fill="url(#ogGlow)" />
  <rect width="1200" height="630" fill="url(#ogGrid64)" />
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="#FFFFFF" fill-opacity="0.65" stroke="#C5B8EC" stroke-width="1" />

  <!-- Left Editorial Column -->
  <g transform="translate(64, 76)">
    <rect width="245" height="34" rx="17" fill="#EFEAFB" stroke="#C5B8EC" stroke-width="1" />
    <text x="122" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="0.08em" fill="#6A3FD0">WEBSITE &amp; PERFORMANCE</text>

    <text x="0" y="112" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="700" fill="#17122B">
      <tspan x="0" dy="0">Landing Pages for Meta and</tspan><tspan x="0" dy="48">Google Ads: High-Conversio…</tspan>
    </text>

    <!-- Labels Row -->
    <g transform="translate(0, 250)">
      <g transform="translate(0, 0)">
            <rect width="120" height="28" rx="6" fill="#17122B" stroke="#C5B8EC" stroke-width="1" />
            <text x="60" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#FFFFFF">AD MATCH</text>
          </g><g transform="translate(132, 0)">
            <rect width="120" height="28" rx="6" fill="#F8F6FE" stroke="#C5B8EC" stroke-width="1" />
            <text x="60" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#17122B">FAST LOAD</text>
          </g><g transform="translate(264, 0)">
            <rect width="120" height="28" rx="6" fill="#F8F6FE" stroke="#C5B8EC" stroke-width="1" />
            <text x="60" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#17122B">LEAD FORM</text>
          </g>
    </g>

    <!-- Brand Footer -->
    <g transform="translate(0, 425)">
      <rect width="38" height="38" rx="10" fill="#6A3FD0" />
      <text x="19" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700" fill="#FFFFFF">C</text>
      <text x="52" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="0.08em" fill="#17122B">CHESTAADOTCOM</text>
      <text x="52" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#5B5675">chestaa.com · BSD &amp; South Tangerang</text>
    </g>
  </g>

  <!-- Right Miniature Hero Scene -->
  <g transform="translate(650, 95) scale(0.45)">
    <g>
        <rect x="300" y="180" width="1000" height="540" rx="24" fill="#FFFFFF" stroke="#C5B8EC" stroke-width="1" />
        <rect x="300" y="180" width="1000" height="58" rx="24" fill="#17122B" />
        <circle cx="340" cy="209" r="7" fill="#9E7BF0" />
        <circle cx="364" cy="209" r="7" fill="#B9A2F2" />
        <circle cx="388" cy="209" r="7" fill="#EFEAFB" />
        <!-- Speed Ring -->
        <circle cx="610" cy="465" r="175" fill="#F8F6FE" stroke="#DED8F2" stroke-width="22" />
        <path d="M 465 555 A 175 175 0 1 1 760 380" fill="none" stroke="#6A3FD0" stroke-width="24" stroke-linecap="round" />
        <circle cx="610" cy="465" r="95" fill="#17122B" />
        <line x1="610" y1="465" x2="705" y2="360" stroke="#B9A2F2" stroke-width="6" stroke-linecap="round" />
        <circle cx="610" cy="465" r="14" fill="#FFFFFF" />
        <!-- Slow vs Fast Bars -->
        <rect x="870" y="290" width="315" height="46" rx="10" fill="#2B1763" />
        <rect x="870" y="356" width="257" height="46" rx="10" fill="#6A3FD0" />
        <rect x="870" y="422" width="175" height="46" rx="10" fill="#B9A2F2" />
        <rect x="870" y="495" width="360" height="120" rx="14" fill="#EFEAFB" stroke="#C5B8EC" stroke-width="1" />
        <rect x="894" y="525" width="190" height="22" rx="6" fill="#17122B" />
        <rect x="894" y="562" width="280" height="18" rx="6" fill="#6A3FD0" />
      </g>
  </g>
</svg>