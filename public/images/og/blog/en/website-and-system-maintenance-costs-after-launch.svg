<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="Technical maintenance gear beside a calendar grid scheduling security patches, automated backups, and server renewals">
  <defs>
