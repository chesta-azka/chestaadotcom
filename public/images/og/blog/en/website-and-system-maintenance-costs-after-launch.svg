        <rect x="945" y="445" width="120" height="85" rx="10" fill="#FFFFFF" stroke="#C5B8EC" />
        <rect x="1095" y="445" width="135" height="85" rx="10" fill="#5230B0" />
        <rect x="795" y="555" width="435" height="75" rx="12" fill="#EFEAFB" />
