        <path d="M 715 405 A 96 96 0 1 1 885 335" fill="none" stroke="#6A3FD0" stroke-width="18" stroke-linecap="round" />
        <circle cx="800" cy="365" r="38" fill="#17122B" />
        <rect x="695" y="515" width="210" height="32" rx="8" fill="#17122B" />
        <!-- Card 3: CLS -->
        <rect x="990" y="250" width="300" height="430" rx="18" fill="#2B1763" />
        <circle cx="1140" cy="405" r="96" fill="none" stroke="#5230B0" stroke-width="18" />
        <path d="M 1055 435 A 96 96 0 1 1 1225 385" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" />
        <circle cx="1140" cy="405" r="36" fill="#9E7BF0" />
