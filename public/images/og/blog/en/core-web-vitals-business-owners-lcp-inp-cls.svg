        <circle cx="460" cy="405" r="96" fill="none" stroke="#2B1763" stroke-width="18" />
        <path d="M 380 455 A 96 96 0 1 1 545 365" fill="none" stroke="#9E7BF0" stroke-width="18" stroke-linecap="round" />
