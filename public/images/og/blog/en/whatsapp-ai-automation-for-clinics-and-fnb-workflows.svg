<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="Customer WhatsApp message stream for clinics and F&amp;B syncing automatically into a reservation calendar slot grid">
  <defs>
    <pattern id="ogGrid64" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#17122B" stroke-width="1" stroke-opacity="0.04" />
    </pattern>
    <radialGradient id="ogGlow" cx="920" cy="315" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B9A2F2" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#F8F6FE" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#F8F6FE" />
  <rect width="1200" height="630" fill="url(#ogGlow)" />
  <rect width="1200" height="630" fill="url(#ogGrid64)" />
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="#FFFFFF" fill-opacity="0.65" stroke="#C5B8EC" stroke-width="1" />

  <!-- Left Editorial Column -->
  <g transform="translate(64, 76)">
    <rect width="270" height="34" rx="17" fill="#EFEAFB" stroke="#C5B8EC" stroke-width="1" />
    <text x="135" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="0.08em" fill="#6A3FD0">AI &amp; WORKFLOW AUTOMATION</text>

    <text x="0" y="112" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="700" fill="#17122B">
      <tspan x="0" dy="0">WhatsApp &amp; AI Automation</tspan><tspan x="0" dy="48">for Clinics and F&amp;B: Real-…</tspan>
    </text>

    <!-- Labels Row -->
    <g transform="translate(0, 250)">
      <g transform="translate(0, 0)">
            <rect width="120" height="28" rx="6" fill="#17122B" stroke="#C5B8EC" stroke-width="1" />
            <text x="60" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#FFFFFF">WA CHAT</text>
          </g><g transform="translate(132, 0)">
            <rect width="120" height="28" rx="6" fill="#F8F6FE" stroke="#C5B8EC" stroke-width="1" />
            <text x="60" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#17122B">CALENDAR</text>
          </g><g transform="translate(264, 0)">
            <rect width="120" height="28" rx="6" fill="#F8F6FE" stroke="#C5B8EC" stroke-width="1" />
            <text x="60" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#17122B">REMINDER</text>
          </g>
    </g>

    <!-- Brand Footer -->
    <g transform="translate(0, 425)">
      <rect width="38" height="38" rx="10" fill="#6A3FD0" />
      <text x="19" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700" fill="#FFFFFF">C</text>
      <text x="52" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="0.08em" fill="#17122B">CHESTAADOTCOM</text>
      <text x="52" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#5B5675">chestaa.com · BSD &amp; South Tangerang</text>
    </g>
  </g>

  <!-- Right Miniature Hero Scene -->
  <g transform="translate(650, 95) scale(0.45)">
    <g>
        <rect x="270" y="180" width="1060" height="540" rx="24" fill="#FFFFFF" stroke="#C5B8EC" stroke-width="1" />
        <!-- Left Chat Stream -->
        <rect x="315" y="230" width="420" height="440" rx="18" fill="#F8F6FE" stroke="#C5B8EC" />
        <rect x="345" y="265" width="290" height="78" rx="16" fill="#17122B" />
        <rect x="415" y="368" width="290" height="82" rx="16" fill="#6A3FD0" />
        <rect x="345" y="475" width="310" height="78" rx="16" fill="#2B1763" />
        <rect x="345" y="580" width="360" height="52" rx="12" fill="#FFFFFF" stroke="#C5B8EC" />
        <!-- Flow Arrow Bridge -->
        <path d="M 735 450 L 815 450" stroke="#6A3FD0" stroke-width="6" />
        <circle cx="775" cy="450" r="24" fill="#6A3FD0" />
        <!-- Right Calendar Grid -->
        <rect x="815" y="230" width="470" height="440" rx="18" fill="#17122B" />
        <rect x="850" y="275" width="400" height="56" rx="10" fill="#5230B0" />
        <rect x="850" y="355" width="120" height="90" rx="10" fill="#FFFFFF" />
        <rect x="990" y="355" width="120" height="90" rx="10" fill="#9E7BF0" />
        <rect x="1130" y="355" width="120" height="90" rx="10" fill="#EFEAFB" />
        <rect x="850" y="468" width="120" height="90" rx="10" fill="#6A3FD0" />
        <rect x="990" y="468" width="260" height="90" rx="10" fill="#FFFFFF" />
        <rect x="850" y="582" width="400" height="52" rx="10" fill="#2B1763" />
