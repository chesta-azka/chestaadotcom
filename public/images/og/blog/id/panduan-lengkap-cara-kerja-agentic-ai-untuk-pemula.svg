<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="Diagram siklus kerja Agentic AI meliputi tahap perencanaan, pemanggilan tool, dan evaluasi hasil untuk operasional bisnis">
  <defs>
    <pattern id="ogGrid64" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#17122B" stroke-width="1" stroke-opacity="0.04" />
    </pattern>
    <radialGradient id="ogGlow" cx="920" cy="315" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B9A2F2" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#F8F6FE" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#F8F6FE" />
  <rect width="1200" height="630" fill="url(#ogGlow)" />
  <rect width="1200" height="630" fill="url(#ogGrid64)" />
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="#FFFFFF" fill-opacity="0.65" stroke="#C5B8EC" stroke-width="1" />

  <!-- Left Editorial Column -->
  <g transform="translate(64, 76)">
    <rect width="245" height="34" rx="17" fill="#EFEAFB" stroke="#C5B8EC" stroke-width="1" />
    <text x="122" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="0.08em" fill="#6A3FD0">OTOMASI AI &amp; WORKFLOW</text>

    <text x="0" y="112" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="700" fill="#17122B">
      <tspan x="0" dy="0">Panduan Lengkap: Cara Kerja</tspan><tspan x="0" dy="48">Agentic AI untuk Pemula</tspan>
    </text>

    <!-- Labels Row -->
    <g transform="translate(0, 250)">
      <g transform="translate(0, 0)">
            <rect width="120" height="28" rx="6" fill="#17122B" stroke="#C5B8EC" stroke-width="1" />
            <text x="60" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#FFFFFF">PLAN</text>
          </g><g transform="translate(132, 0)">
            <rect width="120" height="28" rx="6" fill="#F8F6FE" stroke="#C5B8EC" stroke-width="1" />
            <text x="60" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#17122B">ACT</text>
          </g><g transform="translate(264, 0)">
            <rect width="120" height="28" rx="6" fill="#F8F6FE" stroke="#C5B8EC" stroke-width="1" />
            <text x="60" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#17122B">OBSERVE</text>
          </g>
    </g>

    <!-- Brand Footer -->
    <g transform="translate(0, 425)">
      <rect width="38" height="38" rx="10" fill="#6A3FD0" />
      <text x="19" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700" fill="#FFFFFF">C</text>
      <text x="52" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="0.08em" fill="#17122B">CHESTAADOTCOM</text>
      <text x="52" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#5B5675">chestaa.com · BSD &amp; Tangerang Selatan</text>
    </g>
  </g>

  <!-- Right Miniature Hero Scene -->
  <g transform="translate(650, 95) scale(0.45)">
    <g>
        <rect x="285" y="175" width="1030" height="550" rx="28" fill="#FFFFFF" stroke="#C5B8EC" />
        <circle cx="800" cy="450" r="215" fill="none" stroke="#B9A2F2" stroke-width="14" stroke-dasharray="24 14" />
        <circle cx="800" cy="450" r="95" fill="#17122B" />
        <circle cx="800" cy="450" r="36" fill="#7C54E0" />
        <!-- Step 1: Plan (Top) -->
        <rect x="640" y="195" width="320" height="110" rx="18" fill="#2B1763" />
        <rect x="680" y="230" width="240" height="40" rx="8" fill="#FFFFFF" />
        <!-- Step 2: Act (Bottom Left) -->
        <rect x="330" y="520" width="320" height="145" rx="18" fill="#17122B" />
        <rect x="365" y="555" width="250" height="34" rx="8" fill="#9E7BF0" />
        <rect x="365" y="605" width="180" height="26" rx="6" fill="#EFEAFB" />
        <!-- Step 3: Observe (Bottom Right) -->
        <rect x="950" y="520" width="320" height="145" rx="18" fill="#6A3FD0" />
        <rect x="985" y="555" width="250" height="34" rx="8" fill="#FFFFFF" />
        <rect x="985" y="605" width="190" height="26" rx="6" fill="#17122B" />
      </g>
  </g>
</svg>