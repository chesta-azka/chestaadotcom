<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="Ilustrasi kotak ekstraksi jawaban mesin pencari AI yang mengutip ringkasan terstruktur dan fakta terverifikasi bisnis lokal">
  <defs>
