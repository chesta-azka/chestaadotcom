<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="Pohon hierarki data terstruktur JSON-LD Schema.org yang menautkan LocalBusiness, Service, dan FAQPage tanpa duplikasi">
  <defs>
    <pattern id="ogGrid64" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#17122B" stroke-width="1" stroke-opacity="0.04" />
    </pattern>
    <radialGradient id="ogGlow" cx="920" cy="315" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B9A2F2" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#F8F6FE" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#F8F6FE" />
  <rect width="1200" height="630" fill="url(#ogGlow)" />
  <rect width="1200" height="630" fill="url(#ogGrid64)" />
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="#FFFFFF" fill-opacity="0.65" stroke="#C5B8EC" stroke-width="1" />

  <!-- Left Editorial Column -->
  <g transform="translate(64, 76)">
    <rect width="262" height="34" rx="17" fill="#EFEAFB" stroke="#C5B8EC" stroke-width="1" />
    <text x="131" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="0.08em" fill="#6A3FD0">SEO LOKAL &amp; PERTUMBUHAN</text>

    <text x="0" y="112" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="700" fill="#17122B">
      <tspan x="0" dy="0">Schema Markup untuk Bisnis</tspan><tspan x="0" dy="48">Lokal: Panduan Praktis unt…</tspan>
    </text>

    <!-- Labels Row -->
    <g transform="translate(0, 250)">
      <g transform="translate(0, 0)">
            <rect width="120" height="28" rx="6" fill="#17122B" stroke="#C5B8EC" stroke-width="1" />
            <text x="60" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#FFFFFF">JSON-LD</text>
          </g><g transform="translate(132, 0)">
            <rect width="120" height="28" rx="6" fill="#F8F6FE" stroke="#C5B8EC" stroke-width="1" />
            <text x="60" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#17122B">@GRAPH</text>
          </g><g transform="translate(264, 0)">
            <rect width="120" height="28" rx="6" fill="#F8F6FE" stroke="#C5B8EC" stroke-width="1" />
            <text x="60" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#17122B">ENTITY</text>
          </g>
    </g>

    <!-- Brand Footer -->
    <g transform="translate(0, 425)">
      <rect width="38" height="38" rx="10" fill="#6A3FD0" />
      <text x="19" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700" fill="#FFFFFF">C</text>
      <text x="52" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="0.08em" fill="#17122B">CHESTAADOTCOM</text>
      <text x="52" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#5B5675">chestaa.com · BSD &amp; Tangerang Selatan</text>
    </g>
  </g>

  <!-- Right Miniature Hero Scene -->
  <g transform="translate(650, 95) scale(0.45)">
    <g>
        <rect x="280" y="175" width="1040" height="550" rx="24" fill="#17122B" />
        <!-- Root @graph Node -->
        <rect x="630" y="220" width="340" height="110" rx="18" fill="#FFFFFF" />
        <rect x="675" y="255" width="250" height="40" rx="8" fill="#5230B0" />
        <!-- Branch Lines -->
        <line x1="800" y1="330" x2="450" y2="480" stroke="#B9A2F2" stroke-width="4" />
        <line x1="800" y1="330" x2="800" y2="480" stroke="#B9A2F2" stroke-width="4" />
        <line x1="800" y1="330" x2="1150" y2="480" stroke="#B9A2F2" stroke-width="4" />
        <!-- Child Schema Nodes -->
        <rect x="330" y="480" width="260" height="190" rx="18" fill="#6A3FD0" />
        <rect x="365" y="520" width="190" height="45" rx="8" fill="#FFFFFF" />
        <rect x="365" y="585" width="150" height="45" rx="8" fill="#17122B" />

        <rect x="670" y="480" width="260" height="190" rx="18" fill="#B9A2F2" />
        <rect x="705" y="520" width="190" height="45" rx="8" fill="#17122B" />
        <rect x="705" y="585" width="150" height="45" rx="8" fill="#FFFFFF" />

        <rect x="1010" y="480" width="260" height="190" rx="18" fill="#FFFFFF" />
        <rect x="1045" y="520" width="190" height="45" rx="8" fill="#17122B" />
        <rect x="1045" y="585" width="150" height="45" rx="8" fill="#6A3FD0" />
      </g>
