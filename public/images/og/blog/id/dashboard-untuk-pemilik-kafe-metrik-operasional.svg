<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="Kisi antarmuka dashboard operasional kafe yang menampilkan grafik penjualan per jam, rasio HPP bahan, dan stok kritis">
  <defs>
    <pattern id="ogGrid64" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#17122B" stroke-width="1" stroke-opacity="0.04" />
    </pattern>
    <radialGradient id="ogGlow" cx="920" cy="315" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B9A2F2" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#F8F6FE" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#F8F6FE" />
  <rect width="1200" height="630" fill="url(#ogGlow)" />
  <rect width="1200" height="630" fill="url(#ogGrid64)" />
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="#FFFFFF" fill-opacity="0.65" stroke="#C5B8EC" stroke-width="1" />

  <!-- Left Editorial Column -->
  <g transform="translate(64, 76)">
    <rect width="270" height="34" rx="17" fill="#EFEAFB" stroke="#C5B8EC" stroke-width="1" />
    <text x="135" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="0.08em" fill="#6A3FD0">STRATEGI &amp; INVESTASI WEB</text>

    <text x="0" y="112" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="700" fill="#17122B">
      <tspan x="0" dy="0">Dashboard untuk Pemilik</tspan><tspan x="0" dy="48">Kafe: Metrik yang Layak Di…</tspan>
    </text>

    <!-- Labels Row -->
    <g transform="translate(0, 250)">
      <g transform="translate(0, 0)">
            <rect width="120" height="28" rx="6" fill="#17122B" stroke="#C5B8EC" stroke-width="1" />
            <text x="60" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#FFFFFF">HOURLY POS</text>
          </g><g transform="translate(132, 0)">
            <rect width="120" height="28" rx="6" fill="#F8F6FE" stroke="#C5B8EC" stroke-width="1" />
            <text x="60" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#17122B">COGS %</text>
          </g><g transform="translate(264, 0)">
            <rect width="120" height="28" rx="6" fill="#F8F6FE" stroke="#C5B8EC" stroke-width="1" />
            <text x="60" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#17122B">STOCK</text>
          </g>
    </g>

    <!-- Brand Footer -->
    <g transform="translate(0, 425)">
      <rect width="38" height="38" rx="10" fill="#6A3FD0" />
      <text x="19" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700" fill="#FFFFFF">C</text>
      <text x="52" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="0.08em" fill="#17122B">CHESTAADOTCOM</text>
      <text x="52" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#5B5675">chestaa.com · BSD &amp; Tangerang Selatan</text>
    </g>
  </g>

  <!-- Right Miniature Hero Scene -->
  <g transform="translate(650, 95) scale(0.45)">
    <g>
        <rect x="275" y="175" width="1050" height="550" rx="24" fill="#17122B" />
        <!-- Top KPI Row -->
        <rect x="315" y="215" width="300" height="160" rx="16" fill="#FFFFFF" />
        <rect x="345" y="245" width="140" height="22" rx="6" fill="#5230B0" />
        <rect x="345" y="290" width="210" height="52" rx="8" fill="#17122B" />

        <rect x="650" y="215" width="300" height="160" rx="16" fill="#6A3FD0" />
        <rect x="680" y="245" width="140" height="22" rx="6" fill="#D8C8FF" />
        <rect x="680" y="290" width="210" height="52" rx="8" fill="#FFFFFF" />

        <rect x="985" y="215" width="300" height="160" rx="16" fill="#2B1763" stroke="#9E7BF0" />
        <rect x="1015" y="245" width="140" height="22" rx="6" fill="#B9A2F2" />
        <rect x="1015" y="290" width="210" height="52" rx="8" fill="#9E7BF0" />

        <!-- Bottom Chart & Alert Panels -->
        <rect x="315" y="405" width="635" height="280" rx="18" fill="#F8F6FE" />
        <rect x="355" y="555" width="75" height="95" rx="8" fill="#9E7BF0" />
        <rect x="455" y="505" width="75" height="145" rx="8" fill="#6A3FD0" />
        <rect x="555" y="460" width="75" height="190" rx="8" fill="#17122B" />
        <rect x="655" y="520" width="75" height="130" rx="8" fill="#5230B0" />
        <rect x="755" y="445" width="140" height="205" rx="10" fill="#2B1763" />

        <rect x="985" y="405" width="300" height="280" rx="18" fill="#FFFFFF" />
        <rect x="1015" y="440" width="240" height="65" rx="10" fill="#17122B" />
        <rect x="1015" y="525" width="240" height="65" rx="10" fill="#6A3FD0" />
        <rect x="1015" y="610" width="170" height="45" rx="8" fill="#B9A2F2" />
      </g>
  </g>
</svg>