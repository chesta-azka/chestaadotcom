<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="Diagram tingkatan komponen biaya pembuatan website bisnis berdasarkan kompleksitas halaman, fitur, dan integrasi sistem">
  <defs>
    <pattern id="ogGrid64" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#17122B" stroke-width="1" stroke-opacity="0.04" />
    </pattern>
    <radialGradient id="ogGlow" cx="920" cy="315" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B9A2F2" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#F8F6FE" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#F8F6FE" />
  <rect width="1200" height="630" fill="url(#ogGlow)" />
  <rect width="1200" height="630" fill="url(#ogGrid64)" />
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="#FFFFFF" fill-opacity="0.65" stroke="#C5B8EC" stroke-width="1" />

  <!-- Left Editorial Column -->
  <g transform="translate(64, 76)">
    <rect width="270" height="34" rx="17" fill="#EFEAFB" stroke="#C5B8EC" stroke-width="1" />
    <text x="135" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="0.08em" fill="#6A3FD0">STRATEGI &amp; INVESTASI WEB</text>

    <text x="0" y="112" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="700" fill="#17122B">
      <tspan x="0" dy="0">Berapa Biaya Bikin Website</tspan><tspan x="0" dy="48">untuk Bisnis? Panduan Harg…</tspan>
    </text>

    <!-- Labels Row -->
    <g transform="translate(0, 250)">
      <g transform="translate(0, 0)">
            <rect width="120" height="28" rx="6" fill="#17122B" stroke="#C5B8EC" stroke-width="1" />
            <text x="60" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#FFFFFF">LANDING</text>
          </g><g transform="translate(132, 0)">
            <rect width="120" height="28" rx="6" fill="#F8F6FE" stroke="#C5B8EC" stroke-width="1" />
            <text x="60" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#17122B">COMPANY</text>
          </g><g transform="translate(264, 0)">
            <rect width="120" height="28" rx="6" fill="#F8F6FE" stroke="#C5B8EC" stroke-width="1" />
            <text x="60" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#17122B">CUSTOM WEB</text>
          </g>
    </g>

    <!-- Brand Footer -->
    <g transform="translate(0, 425)">
      <rect width="38" height="38" rx="10" fill="#6A3FD0" />
      <text x="19" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700" fill="#FFFFFF">C</text>
      <text x="52" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="0.08em" fill="#17122B">CHESTAADOTCOM</text>
      <text x="52" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#5B5675">chestaa.com · BSD &amp; Tangerang Selatan</text>
    </g>
  </g>

  <!-- Right Miniature Hero Scene -->
  <g transform="translate(650, 95) scale(0.45)">
    <g>
        <rect x="280" y="175" width="1040" height="550" rx="24" fill="#FFFFFF" stroke="#C5B8EC" stroke-width="1" />
        <!-- Tier 1 -->
        <rect x="340" y="430" width="260" height="240" rx="16" fill="#EFEAFB" stroke="#C5B8EC" stroke-width="1" />
        <rect x="370" y="465" width="140" height="24" rx="6" fill="#5230B0" />
        <rect x="370" y="510" width="200" height="14" rx="4" fill="#B9A2F2" />
        <rect x="370" y="538" width="175" height="14" rx="4" fill="#B9A2F2" />
        <!-- Tier 2 -->
        <rect x="650" y="320" width="280" height="350" rx="16" fill="#6A3FD0" />
        <rect x="685" y="360" width="170" height="28" rx="6" fill="#FFFFFF" />
        <rect x="685" y="415" width="210" height="16" rx="4" fill="#D8C8FF" />
        <rect x="685" y="448" width="190" height="16" rx="4" fill="#D8C8FF" />
        <rect x="685" y="575" width="210" height="54" rx="10" fill="#17122B" />
        <!-- Tier 3 -->
        <rect x="980" y="220" width="280" height="450" rx="16" fill="#17122B" />
        <rect x="1015" y="265" width="180" height="30" rx="6" fill="#9E7BF0" />
        <rect x="1015" y="320" width="210" height="16" rx="4" fill="#B9A2F2" />
        <rect x="1015" y="355" width="190" height="16" rx="4" fill="#B9A2F2" />
        <rect x="1015" y="390" width="210" height="90" rx="12" fill="#2B1763" stroke="#7C54E0" stroke-width="1" />
        <rect x="1015" y="575" width="210" height="54" rx="10" fill="#FFFFFF" />
      </g>
