<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="Kerangka wireframe landing page berkonversi tinggi dengan penanda daftar periksa proposisi nilai, bukti, dan tombol CTA">
  <defs>
    <pattern id="ogGrid64" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#17122B" stroke-width="1" stroke-opacity="0.04" />
    </pattern>
    <radialGradient id="ogGlow" cx="920" cy="315" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B9A2F2" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#F8F6FE" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#F8F6FE" />
  <rect width="1200" height="630" fill="url(#ogGlow)" />
  <rect width="1200" height="630" fill="url(#ogGrid64)" />
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="#FFFFFF" fill-opacity="0.65" stroke="#C5B8EC" stroke-width="1" />

  <!-- Left Editorial Column -->
  <g transform="translate(64, 76)">
    <rect width="202" height="34" rx="17" fill="#EFEAFB" stroke="#C5B8EC" stroke-width="1" />
    <text x="101" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="0.08em" fill="#6A3FD0">KONVERSI &amp; UI/UX</text>

    <text x="0" y="112" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="700" fill="#17122B">
      <tspan x="0" dy="0">Checklist Landing Page</tspan><tspan x="0" dy="48">Konversi Tinggi untuk Bisn…</tspan>
    </text>

    <!-- Labels Row -->
    <g transform="translate(0, 250)">
      <g transform="translate(0, 0)">
            <rect width="120" height="28" rx="6" fill="#17122B" stroke="#C5B8EC" stroke-width="1" />
            <text x="60" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#FFFFFF">HEADLINE</text>
          </g><g transform="translate(132, 0)">
            <rect width="120" height="28" rx="6" fill="#F8F6FE" stroke="#C5B8EC" stroke-width="1" />
            <text x="60" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#17122B">TRUST</text>
          </g><g transform="translate(264, 0)">
            <rect width="120" height="28" rx="6" fill="#F8F6FE" stroke="#C5B8EC" stroke-width="1" />
            <text x="60" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#17122B">WA CTA</text>
          </g>
    </g>

    <!-- Brand Footer -->
    <g transform="translate(0, 425)">
      <rect width="38" height="38" rx="10" fill="#6A3FD0" />
      <text x="19" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700" fill="#FFFFFF">C</text>
      <text x="52" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="0.08em" fill="#17122B">CHESTAADOTCOM</text>
      <text x="52" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#5B5675">chestaa.com · BSD &amp; Tangerang Selatan</text>
    </g>
  </g>

  <!-- Right Miniature Hero Scene -->
  <g transform="translate(650, 95) scale(0.45)">
    <g>
        <rect x="310" y="165" width="980" height="570" rx="24" fill="#FFFFFF" stroke="#C5B8EC" stroke-width="1" />
        <rect x="310" y="165" width="980" height="62" rx="24" fill="#2B1763" />
        <!-- Left Wireframe Hero Preview -->
        <rect x="355" y="265" width="460" height="425" rx="16" fill="#17122B" />
        <rect x="390" y="305" width="320" height="36" rx="8" fill="#FFFFFF" />
        <rect x="390" y="360" width="380" height="22" rx="6" fill="#B9A2F2" />
        <rect x="390" y="415" width="390" height="150" rx="12" fill="#2B1763" stroke="#7C54E0" />
        <rect x="390" y="595" width="220" height="56" rx="12" fill="#7C54E0" />
        <!-- Right Checklist Rows -->
        <rect x="855" y="265" width="390" height="92" rx="14" fill="#F8F6FE" stroke="#C5B8EC" />
        <circle cx="905" cy="311" r="22" fill="#6A3FD0" />
        <path d="M 895 311 L 903 319 L 917 303" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
        <rect x="945" y="298" width="260" height="26" rx="6" fill="#17122B" />

        <rect x="855" y="376" width="390" height="92" rx="14" fill="#F8F6FE" stroke="#C5B8EC" />
        <circle cx="905" cy="422" r="22" fill="#17122B" />
        <path d="M 895 422 L 903 430 L 917 414" fill="none" stroke="#B9A2F2" stroke-width="4" stroke-linecap="round" />
        <rect x="945" y="409" width="240" height="26" rx="6" fill="#5230B0" />

        <rect x="855" y="487" width="390" height="92" rx="14" fill="#2B1763" />
        <circle cx="905" cy="533" r="22" fill="#FFFFFF" />
        <path d="M 895 533 L 903 541 L 917 525" fill="none" stroke="#5230B0" stroke-width="4" stroke-linecap="round" />
        <rect x="945" y="520" width="250" height="26" rx="6" fill="#FFFFFF" />

        <rect x="855" y="598" width="390" height="92" rx="14" fill="#EFEAFB" stroke="#C5B8EC" />
        <circle cx="905" cy="644" r="22" fill="#6A3FD0" />
        <rect x="945" y="631" width="220" height="26" rx="6" fill="#17122B" />
      </g>
  </g>
</svg>